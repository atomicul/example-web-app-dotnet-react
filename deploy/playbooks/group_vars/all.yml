---
microsoft_key_url: https://packages.microsoft.com/keys/microsoft.asc
microsoft_key_checksum: sha256:2fa9c05d591a1582a9aba276272478c262e95ad00acf60eaee1644d93941e3c6
mssql_server_version: 17.0.5005.3-1
mssql_tools_version: 18.7.1.1-1
mssql_odbc_version: 18.7.1.1-1

docker_key_url: https://download.docker.com/linux/ubuntu/gpg
docker_key_checksum: sha256:1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570
docker_version: 5:29.9.0-1~ubuntu.24.04~noble
containerd_version: 2.4.1-2~ubuntu.24.04~noble

dotnet_runtime_version: 10.0.12
dotnet_runtime_archive: aspnetcore-runtime-{{ dotnet_runtime_version }}-linux-x64.tar.gz
dotnet_runtime_url: https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/{{ dotnet_runtime_version }}/{{ dotnet_runtime_archive }}
dotnet_runtime_checksum: sha512:c489fc3a9dcc85f24f2d52e9a81b46fdf51affc8a360d008dbd5e3b7ce524969adc4a54f555ad13e29b822f59ed1cae9785608cbac2282f2c9c4fda45c21c7d1
dotnet_root: /opt/dotnet/{{ dotnet_runtime_version }}

# SQL Server's edition: Express is free in production; Standard and Enterprise need a license.
mssql_edition: Express
mssql_port: 1433

todoapp_config_dir: /etc/todoapp
todoapp_install_dir: /opt/todoapp
todoapp_port: 80
todoapp_acme_webroot: /var/lib/todoapp/acme
todoapp_database: TodoApp
todoapp_database_login: todoapp

todoapp_settings:
  Kestrel:
    Endpoints:
      Http:
        Url: http://*:{{ todoapp_port }}
  DataProtection:
    Certificate:
      Path: "{{ todoapp_config_dir }}/dataprotection.pfx"
  AcmeChallenge:
    WebRoot: "{{ todoapp_acme_webroot }}"
