---
- name: Create the Dapr sidecar's system user
  ansible.builtin.user:
    name: "{{ dapr_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false

- name: Create daprd's directory
  ansible.builtin.file:
    path: "{{ dapr_root }}"
    state: directory
    mode: "0755"

- name: Download daprd {{ dapr_version }}
  ansible.builtin.get_url:
    url: "{{ dapr_url }}"
    dest: /opt/dapr/{{ dapr_archive }}
    checksum: "{{ dapr_checksum }}"
    mode: "0644"

- name: Unpack daprd
  ansible.builtin.unarchive:
    src: /opt/dapr/{{ dapr_archive }}
    dest: "{{ dapr_root }}"
    remote_src: true
    creates: "{{ dapr_root }}/daprd"

- name: Create the components' directory, which only the sidecar can read, as components may hold secrets
  ansible.builtin.file:
    path: "{{ dapr_components_dir }}"
    state: directory
    owner: "{{ dapr_user }}"
    group: "{{ dapr_user }}"
    mode: "0700"

- name: Install the components of the given directory
  ansible.builtin.include_tasks: components.yml
  when: dapr_components_source | length > 0

- name: Create the sockets' directory on every boot
  ansible.builtin.template:
    src: todoapp-dapr.tmpfiles.j2
    dest: /etc/tmpfiles.d/todoapp-dapr.conf
    mode: "0644"

- name: Create the sockets' directory, where only the app's group can reach the sidecar's sockets
  ansible.builtin.file:
    path: "{{ dapr_socket_dir }}"
    state: directory
    owner: "{{ dapr_user }}"
    group: todoapp
    mode: "2750"

- name: Install the sidecar's service
  ansible.builtin.template:
    src: todoapp-dapr.service.j2
    dest: /etc/systemd/system/todoapp-dapr.service
    mode: "0644"
  notify: Restart the Dapr sidecar

- name: Restart the sidecar if anything changed
  ansible.builtin.meta: flush_handlers

- name: Start the sidecar now and on boot
  ansible.builtin.systemd_service:
    name: todoapp-dapr
    state: started
    enabled: true
