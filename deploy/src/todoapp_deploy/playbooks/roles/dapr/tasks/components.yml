---
- name: Find the components to install
  ansible.builtin.find:
    paths: "{{ dapr_components_source }}"
    patterns: "*.yaml,*.yml"
  delegate_to: localhost
  become: false
  register: dapr_new_components

- name: Find the components the host has
  ansible.builtin.find:
    paths: "{{ dapr_components_dir }}"
    patterns: "*.yaml,*.yml"
  register: dapr_installed_components

- name: Copy the components to the host
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ dapr_components_dir }}/{{ item.path | basename }}"
    owner: "{{ dapr_user }}"
    group: "{{ dapr_user }}"
    mode: "0600"
  loop: "{{ dapr_new_components.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  notify: Restart the Dapr sidecar

- name: Remove the host's components that the directory doesn't have
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ dapr_installed_components.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: item.path | basename not in dapr_new_components.files | map(attribute='path') | map('basename')
  notify: Restart the Dapr sidecar
