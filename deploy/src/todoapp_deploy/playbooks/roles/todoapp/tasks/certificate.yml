---
- name: Ask for the Data Protection certificate, unless --certificate gives it
  ansible.builtin.pause:
    prompt: >-
      Data Protection certificate: type the local path of a PFX, e.g. one made with generate-certificate, or press
      Enter to store the keys that protect sessions unencrypted
  register: todoapp_certificate_input
  when: todoapp_certificate_source | length == 0

- name: Remember the certificate's local path
  ansible.builtin.set_fact:
    todoapp_certificate_file: >-
      {{ [todoapp_controller_directory, todoapp_certificate_path | ansible.builtin.expanduser]
         | ansible.builtin.path_join if todoapp_certificate_path else '' }}
  vars:
    todoapp_certificate_path: "{{ todoapp_certificate_source or todoapp_certificate_input.user_input | default('') }}"
  run_once: true

- name: Install the certificate
  when: todoapp_certificate_file | length > 0
  block:
    - name: Read the certificate's password from TODOAPP_CERTIFICATE_PASSWORD
      ansible.builtin.set_fact:
        todoapp_certificate_password_variable: "{{ lookup('ansible.builtin.env', 'TODOAPP_CERTIFICATE_PASSWORD') }}"
      no_log: true
      run_once: true

    - name: Ask for the certificate's password, unless TODOAPP_CERTIFICATE_PASSWORD has it
      ansible.builtin.pause:
        prompt: Password of the PFX
        echo: false
      register: todoapp_certificate_password_input
      when: todoapp_certificate_password_variable | length == 0

    - name: Remember the certificate's password
      ansible.builtin.set_fact:
        todoapp_certificate_password: >-
          {{ todoapp_certificate_password_variable or todoapp_certificate_password_input.user_input | default('') }}
      no_log: true
      run_once: true

    - name: Check that the certificate opens with its password
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python | dirname }}/check-certificate"
          - "{{ todoapp_certificate_file }}"
      environment:
        TODOAPP_CERTIFICATE_PASSWORD: "{{ todoapp_certificate_password }}"
      delegate_to: localhost
      become: false
      register: todoapp_certificate_check
      changed_when: false
      failed_when: false

    - name: Require the certificate to open with its password
      ansible.builtin.assert:
        that: todoapp_certificate_check.rc == 0
        fail_msg: "{{ todoapp_certificate_check.stderr }}"
        quiet: true

    - name: Copy the certificate to the host
      ansible.builtin.copy:
        src: "{{ todoapp_certificate_file }}"
        dest: "{{ todoapp_config_dir }}/dataprotection.pfx"
        owner: root
        group: todoapp
        mode: "0640"
      notify: Restart the app

    - name: Write the certificate settings
      ansible.builtin.template:
        src: certificate.env.j2
        dest: "{{ todoapp_config_dir }}/certificate.env"
        mode: "0600"
      no_log: true
      notify: Restart the app
