---
- name: Read the database connection string from TODOAPP_CONNECTION_STRING
  ansible.builtin.set_fact:
    todoapp_connection_string_variable: "{{ lookup('ansible.builtin.env', 'TODOAPP_CONNECTION_STRING') }}"
  no_log: true

- name: Ask for the database connection string, unless TODOAPP_CONNECTION_STRING has it
  ansible.builtin.pause:
    prompt: Connection string the app connects to its database with, such as the one setup-database showed
    echo: false
  register: todoapp_connection_string_input
  when: todoapp_connection_string_variable | length == 0

- name: Remember the database connection string
  ansible.builtin.set_fact:
    todoapp_connection_string: >-
      {{ todoapp_connection_string_variable or todoapp_connection_string_input.user_input | default('') }}
  no_log: true

- name: Require a database connection string
  ansible.builtin.assert:
    that: todoapp_connection_string | length > 0
    fail_msg: The database connection string can't be empty
    quiet: true

- name: Write the database connection string
  ansible.builtin.template:
    src: database.env.j2
    dest: "{{ todoapp_config_dir }}/database.env"
    mode: "0600"
  no_log: true
  notify: Restart the app
