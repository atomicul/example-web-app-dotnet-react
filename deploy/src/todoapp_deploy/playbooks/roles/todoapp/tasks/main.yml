---
- name: Create the app's system user
  ansible.builtin.user:
    name: todoapp
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false

- name: Create the app's configuration directory
  ansible.builtin.file:
    path: "{{ todoapp_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install unzip, to unpack the release
  ansible.builtin.apt:
    name: unzip

- name: Create the release's directory
  ansible.builtin.file:
    path: "{{ todoapp_install_dir }}/releases/{{ release_tag }}"
    state: directory
    mode: "0755"

- name: Look for the release on the host
  ansible.builtin.stat:
    path: "{{ todoapp_install_dir }}/releases/{{ release_tag }}/TodoApi.dll"
  register: todoapp_installed_release

- name: Download the release, on this machine when the host can't
  ansible.builtin.include_tasks: release.yml
  when: not todoapp_installed_release.stat.exists

- name: Unpack the release
  ansible.builtin.unarchive:
    src: "{{ todoapp_release_zip }}"
    dest: "{{ todoapp_install_dir }}/releases/{{ release_tag }}"
    remote_src: true
    creates: "{{ todoapp_install_dir }}/releases/{{ release_tag }}/TodoApi.dll"

- name: Look for the Data Protection certificate on the host
  ansible.builtin.stat:
    path: "{{ todoapp_config_dir }}/dataprotection.pfx"
  register: todoapp_installed_certificate

- name: Copy the deployment's environment variables to the host
  ansible.builtin.copy:
    src: "{{ todoapp_env_file_source }}"
    dest: "{{ todoapp_deployment_env }}"
    mode: "0600"
  diff: false
  when: todoapp_env_file_source | length > 0
  notify: Restart the app

- name: Configure the Data Protection certificate
  ansible.builtin.include_tasks: certificate.yml
  when: todoapp_certificate_source | length > 0 or not todoapp_installed_certificate.stat.exists

- name: Write the app's settings
  ansible.builtin.include_tasks: settings.yml

- name: Link the host's settings into the release
  ansible.builtin.file:
    src: "{{ todoapp_config_dir }}/appsettings.Production.json"
    dest: "{{ todoapp_install_dir }}/releases/{{ release_tag }}/appsettings.Production.json"
    state: link

- name: Point the app at the release
  ansible.builtin.file:
    src: "{{ todoapp_install_dir }}/releases/{{ release_tag }}"
    dest: "{{ todoapp_install_dir }}/current"
    state: link
  notify: Restart the app

- name: Install the app's service
  ansible.builtin.template:
    src: todoapp.service.j2
    dest: /etc/systemd/system/todoapp.service
    mode: "0644"
  notify: Restart the app

- name: Restart the app if anything changed
  ansible.builtin.meta: flush_handlers

- name: Start the app now and on boot
  ansible.builtin.systemd_service:
    name: todoapp
    state: started
    enabled: true

- name: Wait until the app is healthy
  ansible.builtin.include_tasks: health.yml
